<!doctype html>
<html class="rk dk" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../web/css/rok.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { width: 1200px; height: 630px; box-sizing: border-box; display: flex; flex-direction: column; padding: 64px 72px; background: var(--bg); color: var(--ink); }
  .top { display: flex; align-items: center; gap: 16px; font-size: 30px; line-height: 38px; font-weight: 600; letter-spacing: -0.018em; }
  .top .sl { color: var(--line-2); font-weight: 400; }
  .top .sec { color: var(--ink-2); font-weight: 500; }
  h1 { margin: auto 0 0; font-size: 64px; line-height: 72px; letter-spacing: -0.032em; font-weight: 600; text-wrap: balance; }
  p { margin: 24px 0 0; font-size: 28px; line-height: 40px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }
  :lang(ko) h1 { letter-spacing: -0.02em; line-height: 80px; }
  :lang(ko) p { line-height: 46px; }
</style>
</head>
<body>
<div class="og">
  <div class="top"><img src="../web/assets/rok.svg" width="48" height="48" alt="">Rok<span class="sl">/</span><span class="sec" id="sec"></span></div>
  <h1 id="title"></h1>
  <p id="lead"></p>
</div>
</body>
</html>
