<!doctype html>
<html class="rk dk" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="../web/css/rok.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; box-sizing: border-box; display: flex; flex-direction: column; padding: 64px 72px; background: var(--bg); color: var(--ink); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 60px 60px; opacity: .6; }
  .mark { position: relative; display: flex; align-items: center; gap: 22px; font-size: 64px; line-height: 64px; font-weight: 600; letter-spacing: -0.03em; }
  h1 { position: relative; margin: 56px 0 0; font-size: 76px; line-height: 80px; letter-spacing: -0.04em; font-weight: 600; }
  h1 span { color: var(--acc); }
  .ft { position: relative; margin-top: auto; display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 22px; line-height: 28px; color: var(--ink-3); }
  .ft .chip { margin-left: auto; font-size: 22px; line-height: 28px; padding: 2px 10px; }
</style>
</head>
<body>
<div class="og">
  <div class="grid"></div>
  <div class="mark"><img src="../web/assets/rok.svg" width="96" height="96" alt="">Rok</div>
  <h1>A compiled language that tells you <span>what to write.</span></h1>
  <div class="ft"><span style="color: var(--acc)">$</span><span style="color: var(--ink)">curl -fsSL rok-lang.org/install.sh | sh</span><span class="chip">0.1.4</span></div>
</div>
</body>
</html>
