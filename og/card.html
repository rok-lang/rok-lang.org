<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'InterOG';src:url('fonts/inter-500.woff2') format('woff2');font-weight:500;font-display:block}
  @font-face{font-family:'InterOG';src:url('fonts/inter-700.woff2') format('woff2');font-weight:700;font-display:block}
  @font-face{font-family:'InterOG';src:url('fonts/inter-800.woff2') format('woff2');font-weight:800;font-display:block}
  @font-face{font-family:'JBMonoOG';src:url('fonts/jbmono-500.woff2') format('woff2');font-weight:500;font-display:block}
  @font-face{font-family:'JBMonoOG';src:url('fonts/jbmono-600.woff2') format('woff2');font-weight:600;font-display:block}
  @font-face{font-family:'JBMonoOG';src:url('fonts/jbmono-700.woff2') format('woff2');font-weight:700;font-display:block}
  :root{
    --fg:#1e1f26; --muted:#5b5e6b; --pink:#be185d; --pink2:#db2777; --cyan:#38bdf8;
    --k:#be185d; --t:#0e7490; --s:#4d7c0f;
    --sans:'InterOG',system-ui,sans-serif;
    --mono:'JBMonoOG',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  .pill,.code,.tcode,.bar .name,.badge .v{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
  html,body{width:1200px;height:630px;overflow:hidden}
  .stage{position:relative;width:1200px;height:630px;font-family:var(--sans);
    background:
      radial-gradient(1100px 760px at -5% -10%, #fde3ef 0%, rgba(253,227,239,0) 55%),
      radial-gradient(1200px 820px at 112% 118%, #dcefff 0%, rgba(220,239,255,0) 55%),
      linear-gradient(135deg,#fdf6fb 0%, #fcfbfd 48%, #eff8ff 100%);}
  .grid{position:absolute;inset:0;
    background-image:radial-gradient(rgba(130,120,150,.13) 1.6px, transparent 1.7px);
    background-size:34px 34px;background-position:17px 17px;
    -webkit-mask-image:linear-gradient(135deg,rgba(0,0,0,.9),rgba(0,0,0,.25));}
  .spark{position:absolute}
  .logo{position:absolute;left:92px;top:78px;width:128px;height:128px;
    filter:drop-shadow(0 16px 26px rgba(190,24,93,.22))}
  .word{position:absolute;left:84px;top:300px;font-size:160px;font-weight:800;
    letter-spacing:-6px;color:var(--fg);line-height:1}
  .pill{position:absolute;left:90px;top:500px;display:flex;align-items:center;
    background:#fff;border:1px solid #efd9e6;border-radius:16px;padding:20px 26px;
    box-shadow:0 10px 30px rgba(120,70,110,.10);
    font-family:var(--mono);font-size:27px;font-weight:600;color:var(--fg)}
  .pill b{color:var(--pink);margin-right:14px;font-weight:700}
  .cur{display:inline-block;width:15px;height:30px;background:var(--pink2);
    margin-left:8px;border-radius:2px;transform:translateY(4px)}
  .win{position:absolute;left:690px;top:84px;width:476px;height:380px;background:#fff;
    border-radius:16px;box-shadow:0 30px 70px rgba(80,50,90,.20),0 2px 0 rgba(0,0,0,.02);overflow:hidden}
  .bar{height:46px;display:flex;align-items:center;padding:0 18px;gap:9px;border-bottom:1px solid #f0edf3}
  .dot{width:13px;height:13px;border-radius:50%}
  .bar .name{margin-left:auto;font-family:var(--mono);font-size:16px;color:#9aa0ab;font-weight:600}
  .code{padding:22px 24px;font-family:var(--mono);font-size:19px;line-height:1.55;color:var(--fg);white-space:pre}
  .k{color:var(--k)} .t{color:var(--t)} .s{color:var(--s)}
  .term{position:absolute;left:636px;top:452px;width:392px;height:150px;background:#17171f;
    border-radius:14px;box-shadow:0 26px 60px rgba(20,10,30,.34);overflow:hidden}
  .tbar{height:40px;display:flex;align-items:center;padding:0 16px;gap:8px}
  .tcode{padding:4px 20px;font-family:var(--mono);font-size:19px;line-height:1.5;color:#e6e5ec;white-space:pre}
  .tcode .p{color:#f9a8d4} .tcode .g{color:#86efac}
  .badge{position:absolute;left:1066px;top:506px;width:110px;height:110px;border-radius:50%;
    background:#fde3ef;border:2px dashed var(--pink2);display:flex;flex-direction:column;
    align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 10px 24px rgba(219,39,119,.18)}
  .badge .v{font-family:var(--mono);font-weight:700;font-size:26px;color:var(--pink)}
  .badge .h{font-size:17px;color:var(--pink2);font-style:italic;margin-top:2px}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="spark" style="left:636px;top:60px"><svg width="34" height="34" viewBox="0 0 24 24" fill="#f472b6"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12 7-2 11-6 12-12z"/></svg></div>
  <div class="spark" style="left:1046px;top:36px"><svg width="26" height="26" viewBox="0 0 24 24" fill="#38bdf8"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12 7-2 11-6 12-12z"/></svg></div>
  <div class="spark" style="left:556px;top:470px"><svg width="22" height="22" viewBox="0 0 24 24" fill="#f472b6"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12 7-2 11-6 12-12z"/></svg></div>

  <img class="logo" src="logo.svg" alt="">
  <div class="word">Rok</div>
  <div class="pill"><b>$</b> rok run hello.rok<span class="cur"></span></div>

  <div class="win">
    <div class="bar">
      <span class="dot" style="background:#f472b6"></span>
      <span class="dot" style="background:#38bdf8"></span>
      <span class="dot" style="background:#d7d4de"></span>
      <span class="name">hello.rok</span>
    </div>
    <div class="code"><span class="k">enum</span> <span class="t">Mood</span> { <span class="t">Happy</span>, <span class="t">Geeky</span> }

<span class="k">fn</span> main() {
    <span class="k">let</span> m = <span class="t">Mood</span>::<span class="t">Geeky</span>;
    println(<span class="k">match</span> m {
        <span class="t">Mood</span>::<span class="t">Happy</span> => <span class="s">"hi :)"</span>,
        <span class="t">Mood</span>::<span class="t">Geeky</span> => <span class="s">"hi, rok!"</span>,
    });
}</div>
  </div>

  <div class="term">
    <div class="tbar">
      <span class="dot" style="background:#f472b6"></span>
      <span class="dot" style="background:#38bdf8"></span>
      <span class="dot" style="background:#3a3a46"></span>
    </div>
    <div class="tcode"><span class="p">$</span> rok run hello.rok
  <span class="g">Finished</span> in 0.10s
hi, rok!</div>
  </div>

  <div class="badge"><div class="v">v0.1</div><div class="h">hello!</div></div>
</div>
</body>
</html>
